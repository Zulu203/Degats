<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marquage des dégâts — iReach (WinDev)</title>
<link rel="stylesheet" href="report2d.css?v=24">
<style>
  :root{
    --bg:#f4f5f7; --panel:#ffffff; --border:#e2e4e9; --text:#1c1e21;
    --muted:#6b7280; --accent:#2f6fb0; --accent-bg:#e6f1fb; --danger:#e24b4a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); overflow:hidden;}
  #app{display:flex; height:100vh;}
  #stage{flex:1; position:relative; background:linear-gradient(#eef1f5,#dfe4ea); min-width:0; min-height:0;}
  #canvasWrap{width:100%; height:100%;}
  #loader{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:12px; background:var(--bg); z-index:20;}
  .spinner{width:34px; height:34px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #hint.warn{color:#b3261e; border-color:#b3261e; font-weight:600;}
  #hint{position:absolute; top:12px; left:12px; font-size:12px; color:var(--muted); background:var(--panel); padding:5px 12px; border-radius:8px; border:1px solid var(--border); z-index:10;}
  #side{width:280px; background:var(--panel); border-left:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden;}

  @media (orientation: portrait), (max-width: 680px){
    #app{flex-direction:column;}
    #stage{flex:1 1 auto; min-height:58%;}
    #side{width:100%; flex:0 0 auto; max-height:40%; border-left:none; border-top:1px solid var(--border);}
    .thumbs{grid-template-columns:1fr 1fr 1fr;}
  }
  .sec{padding:14px 16px; border-bottom:1px solid var(--border);}
  .sec h3{font-size:12px; text-transform:uppercase; letter-spacing:0.04em; color:var(--muted); margin-bottom:10px; font-weight:600;}
  .thumbs{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}
  .thumb{padding:10px 4px; font-size:11px; text-align:center; border:1px solid var(--border); border-radius:8px; background:var(--panel); cursor:pointer; transition:.15s;}
  .thumb.active{border:2px solid var(--accent); background:var(--accent-bg); color:var(--accent); font-weight:600;}
  .thumb.locked{opacity:0.3; cursor:not-allowed; pointer-events:none;}
  .thumb .ic{font-size:20px; display:block; margin-bottom:4px;}
  #dmgList{flex:1; overflow:auto; padding:8px 12px;}
  .dmgRow{display:flex; align-items:center; gap:8px; padding:8px 10px; border:1px solid var(--border); border-radius:8px; margin-bottom:6px; font-size:12px; cursor:pointer;}
  .dmgRow:hover{border-color:var(--accent);}
  .dmgRow .id{color:var(--muted); font-weight:600;}
  .dmgRow .co{margin-left:auto; font-family:ui-monospace,monospace; font-size:10px; color:var(--muted);}
  .dmgRow .del{color:var(--danger); cursor:pointer; padding:0 4px;}
  .gravDot{width:9px; height:9px; border-radius:50%; flex:none;}
  .actions{padding:12px 16px; border-top:1px solid var(--border); display:flex; gap:8px;}
  button.btn{flex:1; padding:9px; font-size:13px; border:1px solid var(--border); border-radius:8px; background:var(--panel); cursor:pointer;}
  button.btn:hover{background:var(--bg);}
  #dirtyBadge{font-size:11px; font-weight:700; color:#fff; background:#b3261e; border-radius:999px; padding:2px 8px; margin-left:6px; vertical-align:middle;}
  #dirtyBadge.saving{background:#b7791f;}
  button.btn.primary{background:var(--accent); color:#fff; border-color:var(--accent);}
  #popup{position:absolute; z-index:30; width:260px; max-width:calc(100% - 16px); flex-direction:column; background:var(--panel); border:1px solid var(--border); border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.18); display:none; overflow:hidden;}
  #popup .ph{padding:6px 10px; border-bottom:1px solid var(--border); font-size:12px; font-weight:600; display:flex; align-items:center; justify-content:space-between;}
  #popup .ph .x{cursor:pointer; color:var(--muted); font-size:16px;}
  #popup .pb{padding:8px 10px; max-height:260px; overflow:auto; flex:1 1 auto; min-height:60px;}
  #popup .pphoto{padding:8px 10px 10px; border-top:1px solid var(--border); background:var(--panel); flex:0 0 auto;}
  .plabel{font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:2px 0 4px; font-weight:600;}
  .typeItem{display:flex; align-items:center; gap:6px; padding:4px 7px; border:1px solid var(--border); border-radius:6px; margin-bottom:3px; font-size:12px; cursor:pointer;}
  .typeItem.on{border-color:var(--accent); background:var(--accent-bg); color:var(--accent);}
  .typeItem .chk{margin-left:auto;}
  .gravRow{display:flex; gap:5px; margin-top:2px;}
  .gravBtn{flex:1; padding:4px 0; font-size:11px; text-align:center; border:1px solid var(--border); border-radius:6px; cursor:pointer;}
  .gravBtn.on{color:#fff; font-weight:600; border-color:transparent;}
  #popup .pf{padding:8px 10px; border-top:1px solid var(--border); display:flex; gap:10px; flex:0 0 auto;}
  #popup .pf button{flex:1; min-height:38px; padding:6px; font-size:13px; border-radius:7px; cursor:pointer; border:1px solid var(--border); background:var(--panel);}
  #popup .pf button.ok{background:var(--accent); color:#fff; border-color:var(--accent);}
  textarea#memo{width:100%; border:1px solid var(--border); border-radius:6px; padding:5px 7px; font-size:11px; font-family:inherit; resize:vertical; min-height:28px; margin-top:2px;}
  .photoRow{display:flex; flex-wrap:wrap; gap:10px; margin-top:4px;}
  .photoRow:empty{display:none;}
  .photoItem{display:flex; flex-direction:column; align-items:center; gap:5px; width:52px;}
  .photoChip{width:52px; height:44px; border:1px solid var(--border); border-radius:7px; background:var(--accent-bg); display:flex; align-items:center; justify-content:center; font-size:20px; cursor:pointer; padding:0;}
  .photoChip.pending{opacity:.5; cursor:default;}
  .photoDel{width:52px; min-height:24px; border:1px solid var(--danger); color:var(--danger); background:var(--panel); border-radius:6px; font-size:11px; cursor:pointer; padding:2px;}
  #btnAddPhoto{display:flex; align-items:center; justify-content:center; gap:6px; width:100%; min-height:40px; margin-top:10px; padding:6px 10px; font-size:13px; font-weight:600; border:1.5px solid var(--accent); color:var(--accent); background:var(--accent-bg); border-radius:8px; cursor:pointer; touch-action:manipulation;}
  #btnAddPhoto:disabled{opacity:.45; cursor:default;}
  #btnAddPhoto:active:not(:disabled){filter:brightness(.92);}
  .dmgRow .ph{color:var(--muted); font-size:11px;}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="canvasWrap"></div>
    <div id="hint"></div>
    <div id="loader"><div class="spinner"></div><div id="loadTxt" style="font-size:13px;color:var(--muted)"></div></div>
    <div id="popup">
      <div class="ph"><span id="popupTitle"></span><span class="x" onclick="closePopup(true)">✕</span></div>
      <div class="pb">
        <div class="plabel" id="lblTypes"></div>
        <div id="typeList"></div>
        <div class="plabel" id="lblGravity" style="margin-top:8px;"></div>
        <div class="gravRow" id="gravRow"></div>
        <div class="plabel" id="lblNote" style="margin-top:8px;"></div>
        <textarea id="memo"></textarea>
      </div>
      <div class="pphoto">
        <div class="plabel" id="lblPhotos"></div>
        <div class="photoRow" id="photoRow"></div>
        <button type="button" id="btnAddPhoto" onclick="requestPhoto()"></button>

  <div id="side">
    <div class="sec">
      <h3 id="lblVehicle"></h3>
      <div class="thumbs" id="thumbs"></div>
    </div>
    <div class="sec" style="flex:1; display:flex; flex-direction:column; padding-bottom:0;">
      <h3><span id="lblDamages"></span> (<span id="cnt">0</span>) <span id="dirtyBadge" hidden></span></h3>
      <div id="dmgList"></div>
    </div>
    <div class="actions">
      <button class="btn" id="btnClearAll" onclick="clearAll()"></button>
      <button class="btn" id="btnReport2D" onclick="open2DReport()"></button>
      <button class="btn primary" id="btnSave" onclick="boutonEnregistrer()">JSON</button>
    </div>
  </div>
</div>

<!-- ============ LANGUE : toujours charger FR (maître) + la langue choisie ============ -->
<script src="lang_fr.js"></script>
<script>
  /* Sauvegarder le français comme base avant que le fichier suivant écrase LANG_DATA */
  var LANG_FR = {};
  if (typeof LANG_DATA !== 'undefined') {
    for (var _k in LANG_DATA) LANG_FR[_k] = LANG_DATA[_k];
  }
</script>
<script>
  /* Charger le fichier de la langue choisie (si pas FR, sinon LANG_DATA reste le FR) */
  var _urlLang = new URLSearchParams(window.location.search).get('lang') || 'fr';
  var _allowedLangs = ['fr','nl','en'];
  if (_allowedLangs.indexOf(_urlLang) === -1) _urlLang = 'fr';
  if (_urlLang !== 'fr') {
    document.write('<script src="lang_' + _urlLang + '.js"><\/script>');
  }
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/meshopt_decoder.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>

/* ============ i18n — FICHIERS EXTERNES ============
   Fichiers : lang_fr.js (maître), lang_nl.js, lang_en.js
   Chacun expose var LANG_DATA = { ... }
   Le français est chargé EN PREMIER via <script>, puis la langue
   choisie par-dessus. Les clés manquantes tombent sur le français. */

/* LANG_FR = copie du français (chargé par lang_fr.js avant ce script) */
var T = {};

function initI18n() {
  // LANG_DATA a été écrasé par le dernier <script lang_xx.js> chargé
  // On fusionne : français d'abord, puis la langue choisie par-dessus
  for (var k in LANG_FR) { T[k] = LANG_FR[k]; }        // base = français
  if (typeof LANG_DATA !== 'undefined') {
    for (var k in LANG_DATA) { T[k] = LANG_DATA[k]; }   // surcharge avec la langue choisie
  }
}

function t(key, replacements) {
  var s = T[key] || key;
  if (replacements) {
    for (var k in replacements) {
      s = s.replace('%' + k, replacements[k]);
    }
  }
  return s;
}

/* Initialiser les traductions (fusionner FR + langue choisie) */
initI18n();

/* ============ APPLIQUER LES TEXTES i18n AU DOM ============ */
function applyI18n() {
  document.getElementById('hint').textContent = t('hint');
  document.getElementById('loadTxt').textContent = t('loading');
  document.getElementById('lblVehicle').textContent = t('lblVehicle');
  document.getElementById('lblDamages').textContent = t('lblDamages');
  document.getElementById('lblTypes').textContent = t('lblTypes');
  document.getElementById('lblGravity').textContent = t('lblGravity');
  document.getElementById('lblNote').textContent = t('lblNote');
  document.getElementById('btnClearAll').textContent = t('btnClearAll');
  if (typeof libelleBoutonEnregistrer === 'function') libelleBoutonEnregistrer();
  document.getElementById('btnPopupCancel').textContent = t('btnCancel');
  document.getElementById('btnPopupOk').textContent = t('btnOk');
  document.getElementById('memo').placeholder = t('memoPlaceholder');
  document.getElementById('lblPhotos').textContent = t('lblPhotos');
  document.getElementById('btnAddPhoto').textContent = t('btnAddPhoto');
}

/* ============ DÉTECTION DU CONTEXTE ============ */
const FILE_MODE = (location.protocol === 'file:');

/* ============ DONNÉES ============ */
const DAMAGE_TYPES = [
  {id:1,name:t('dmgRust'),icon:'🦠'},{id:2,name:t('dmgDent'),icon:'🔨'},
  {id:3,name:t('dmgHail'),icon:'❄️'},{id:4,name:t('dmgBirdpoop'),icon:'💩'},
  {id:5,name:t('dmgScratch'),icon:'✏️'},{id:6,name:t('dmgCrack'),icon:'💠'},
  {id:7,name:t('dmgStar'),icon:'✴️'},
];
const GRAVITIES = [
  {id:1,color:'#5dcaa5'},
  {id:2,color:'#ef9f27'},
  {id:3,color:'#e24b4a'},
];
/* Libellés de gravité traduits (fonction, pas constante, car T peut changer) */
function gravName(id) {
  if (id === 1) return t('sevLow');
  if (id === 2) return t('sevMedium');
  if (id === 3) return t('sevHigh');
  return '';
}

const VEHICLES = [
  {id:'peugeot308', label:'Berline', file:'berline-c.glb', plates:[{x:0.4727, y:0.1746}, {x:-0.4885, y:0.069}]},
  {id:'hyundai_tucson', label:'SUV', file:'suv-c.glb', plates:[{x:0.4730, y:0.1784}, {x:-0.4914, y:0.105}]},
  {id:'volkswagen_van_t6', label:'Van', file:'van-c.glb', plates:[{x:0.4755, y:0.124}, {x:-0.4909, y:0.1105}]}
];

let damages = [];
let currentVehicleId = VEHICLES[0].id;
let _wantedVehicleId = VEHICLES[0].id;   // dernier véhicule demandé (chargement en cours ou terminé)
let _loadSeq = 0;                        // n° du dernier chargement lancé : les plus anciens sont ignorés
let editingIndex = null;
let draftTypes = [], draftGravity = 2;

/* ============ THREE.JS ============ */
const wrap = document.getElementById('canvasWrap');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, wrap.clientWidth/wrap.clientHeight, 0.01, 1000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(wrap.clientWidth, wrap.clientHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.setClearColor(0xeef1f5);
wrap.appendChild(renderer.domElement);

/* Éclairage d'origine (v25) : l'effet « verni » de la v24 (reflets de studio + tons ACES)
   a été retiré à la demande de l'utilisateur. */
scene.add(new THREE.HemisphereLight(0xffffff, 0x888888, 0.9));
const d1=new THREE.DirectionalLight(0xffffff,0.8); d1.position.set(5,10,7); scene.add(d1);
const d2=new THREE.DirectionalLight(0xffffff,0.4); d2.position.set(-5,4,-6); scene.add(d2);

/* Plaques d'immatriculation Automotive Systems (avant et arrière).
   Texture dessinée dans la page à partir de logo-automotive-systems.png (33 Ko),
   posée sur un petit panneau collé au pare-chocs. Elle ne gêne pas la pose des dégâts
   (le panneau n'est pas dans bodyMeshes). */
const PLATE_W = 0.112, PLATE_H = 0.024;         // taille dans le repère du modèle (~52 x 11 cm, couvre la plaque d origine)
let plateMaterial = null;
const plateLogo = new Image();
plateLogo.onload = function(){ drawPlateTexture(); };
plateLogo.onerror = function(){ drawPlateTexture(); };
plateLogo.src = 'logo-automotive-systems.png';
function drawPlateTexture(){
  const c = document.createElement('canvas'); c.width = 1024; c.height = 225;
  const g = c.getContext('2d');
  const r = 26;
  g.fillStyle = '#ffffff';
  g.beginPath(); g.moveTo(r,0); g.arcTo(1024,0,1024,225,r); g.arcTo(1024,225,0,225,r); g.arcTo(0,225,0,0,r); g.arcTo(0,0,1024,0,r); g.closePath(); g.fill();
  g.lineWidth = 10; g.strokeStyle = '#2b2f36'; g.stroke();
  if (plateLogo.complete && plateLogo.naturalWidth) {
    // recadre le logo sur sa partie non blanche
    const t = document.createElement('canvas'); t.width = plateLogo.naturalWidth; t.height = plateLogo.naturalHeight;
    const tg = t.getContext('2d'); tg.drawImage(plateLogo, 0, 0);
    let x0 = t.width, y0 = t.height, x1 = 0, y1 = 0;
    try {
      const d = tg.getImageData(0, 0, t.width, t.height).data;
      for (let y = 0; y < t.height; y++) for (let x = 0; x < t.width; x++) {
        const i = (y * t.width + x) * 4;
        if (d[i+3] > 20 && (d[i] < 235 || d[i+1] < 235 || d[i+2] < 235)) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      }
    } catch (e) { x0 = 0; y0 = 0; x1 = t.width - 1; y1 = t.height - 1; }
    if (x1 <= x0) { x0 = 0; y0 = 0; x1 = t.width - 1; y1 = t.height - 1; }
    const sw = x1 - x0 + 1, sh = y1 - y0 + 1;
    const k = Math.min((1024 - 120) / sw, (225 - 50) / sh);
    const dw = sw * k, dh = sh * k;
    g.drawImage(t, x0, y0, sw, sh, (1024 - dw) / 2, (225 - dh) / 2, dw, dh);
  } else {
    g.fillStyle = '#5f6670'; g.font = 'bold 96px Arial, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('automotive systems', 512, 116);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.encoding = THREE.sRGBEncoding;
  tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  if (plateMaterial) { plateMaterial.map.dispose(); plateMaterial.map = tex; plateMaterial.needsUpdate = true; }
  else plateMaterial = new THREE.MeshStandardMaterial({map:tex, roughness:0.6, metalness:0.0});
}
function addPlates(id){
  const v = VEHICLES.find(function(x){ return x.id === id; });
  if (!v || !v.plates || !carGroup) return;
  if (!plateMaterial) drawPlateTexture();
  v.plates.forEach(function(pl){
    const m = new THREE.Mesh(new THREE.PlaneGeometry(PLATE_W, PLATE_H), plateMaterial);
    m.position.set(pl.x, pl.y, 0);
    m.rotation.y = pl.x > 0 ? Math.PI / 2 : -Math.PI / 2;   // face vers l'arrière (+x) ou l'avant (-x)
    m.name = 'plate';
    carGroup.add(m);
  });
}

/* Ombre douce sous la voiture (dégradé dessiné dans la page, aucun calcul d'ombre coûteux) */
let contactShadow = null;
function makeContactShadow(box){
  if (contactShadow) { scene.remove(contactShadow); contactShadow.geometry.dispose(); contactShadow.material.map.dispose(); contactShadow.material.dispose(); contactShadow = null; }
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(128,128,10,128,128,128);
  grd.addColorStop(0, 'rgba(0,0,0,0.55)');
  grd.addColorStop(0.55, 'rgba(0,0,0,0.28)');
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grd; g.fillRect(0,0,256,256);
  const tex = new THREE.CanvasTexture(c);
  const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
  const mat = new THREE.MeshBasicMaterial({map:tex, transparent:true, depthWrite:false, toneMapped:false});
  contactShadow = new THREE.Mesh(new THREE.PlaneGeometry(size.x*1.25, size.z*1.25), mat);
  contactShadow.rotation.x = -Math.PI/2;
  contactShadow.position.set(center.x, box.min.y + 0.003, center.z);
  contactShadow.renderOrder = -1;
  contactShadow.userData.noReport = true;
  scene.add(contactShadow);
}

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;

const dracoLoader = new THREE.DRACOLoader();
dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/draco/');
const gltfLoader = new THREE.GLTFLoader();
gltfLoader.setDRACOLoader(dracoLoader);
/* Modèles compressés avec gltfpack (EXT_meshopt_compression) : 4 Mo au lieu de 24 Mo */
if (window.MeshoptDecoder) gltfLoader.setMeshoptDecoder(window.MeshoptDecoder);

let carGroup = null;
let bodyMeshes = [];
const markerGroup = new THREE.Group(); scene.add(markerGroup);

/* ---- Loader visuel ---- */
function showLoader(txt){ document.getElementById('loader').style.display='flex';
  if(txt) document.getElementById('loadTxt').textContent=txt; }
function hideLoader(){ document.getElementById('loader').style.display='none'; }

function applyGltf(gltf, id, label, ready){
  if(carGroup) scene.remove(carGroup);
  carGroup = gltf.scene;
  bodyMeshes = [];
  carGroup.traverse(o=>{ if(o.isMesh){ o.geometry.computeBoundingBox(); bodyMeshes.push(o);} });
  const box = new THREE.Box3().setFromObject(carGroup);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const scale = 4 / Math.max(size.x,size.y,size.z);
  carGroup.scale.setScalar(scale);
  carGroup.position.sub(center.multiplyScalar(scale));
  carGroup.position.y += (size.y*scale)/2;
  scene.add(carGroup);
  try { addPlates(id); } catch(e){ console.warn('[PLATES]', e); }
  currentVehicleId = id;
  if(label){ const v=VEHICLES.find(x=>x.id===id); if(v) v.label=label; }
  clearAll(true);
  renderThumbs();
  controls.target.set(0, size.y*scale/2, 0);
  camera.position.set(size.x*scale*1.2, size.y*scale*1.1, size.z*scale*1.4);
  controls.update();
  hideLoader();
  if(ready !== false){
    _modelReady = true;
    if(_pendingLoad){ const p = _pendingLoad; _pendingLoad = null; window.chargerDommages(p); }
  }
}

function b64ToArrayBuffer(b64){
  const clean = String(b64).replace(/\s+/g,'');
  const bin = atob(clean);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return bytes.buffer;
}

function parseGLB(buffer, id, label){
  showLoader(t('decoding'));
  gltfLoader.parse(buffer, '', gltf=>applyGltf(gltf,id,label),
    err=>{ showLoader(t('errParse')); console.error(err); });
}

function loadVehicleFromFile(id){

/* ============ RAYCAST / POSE ============ */
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let downPos=null;
renderer.domElement.addEventListener('pointerdown', e=>{ downPos={x:e.clientX,y:e.clientY}; });
renderer.domElement.addEventListener('pointerup', e=>{
  if(!downPos) return;
  const moved = Math.hypot(e.clientX-downPos.x, e.clientY-downPos.y);
  downPos=null;
  if(moved>5) return;
  if(!carGroup) return;
  if(inWinDev() && !window.__loaded){ flashHint(t('waitDamages')); return; }
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX-rect.left)/rect.width)*2-1;
  mouse.y = -((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(bodyMeshes, true);
  if(!hits.length) return;
  const local = carGroup.worldToLocal(hits[0].point.clone());
  const dmg = {
    damageId: nextId(),
    x:+local.x.toFixed(4), y:+local.y.toFixed(4), z:+local.z.toFixed(4),
    memo:'', gravity:2, damageTypes:[], images:[], _world:hits[0].point.clone()
  };
  damages.push(dmg);
  addMarker(dmg);
  openPopup(damages.length-1, e.clientX, e.clientY);
});

function nextId(){ return damages.reduce((m,d)=>Math.max(m,d.damageId),0)+1; }

function addMarker(dmg){
  const grav = GRAVITIES.find(g=>g.id===dmg.gravity)||GRAVITIES[1];
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(0.06,16,16),
    new THREE.MeshBasicMaterial({color:new THREE.Color(grav.color)})
  );
  m.position.copy(dmg._world);
  m.renderOrder = 999;
  m.material.depthTest = false;
  markerGroup.add(m);
  dmg._marker = m;
}
function refreshMarker(dmg){
  const grav = GRAVITIES.find(g=>g.id===dmg.gravity)||GRAVITIES[1];
  if(dmg._marker) dmg._marker.material.color = new THREE.Color(grav.color);
}

  const pb = pop.querySelector('.pb');
  pop.style.maxHeight = (stage.height - 16) + 'px';
  if (pb) pb.style.maxHeight = 'none';
  const pw = pop.offsetWidth || 260;
  const ph = pop.offsetHeight || 300;
  let x = (screenX!==undefined? screenX-stage.left+14 : (stage.width-pw)/2);

function damageToRow(d){
  const tp = d.damageTypes || [];
  return {
    damage_id: d.damageId,
    position_xvalue: d.x,
    position_yvalue: d.y,
    position_zvalue: d.z,
    damage_level: d.gravity,
    memo: d.memo || '',
    digital: (d.images||[]).map(function(im){ return im.path; }).join(','),
    idcarstock_damage1: tp[0] ? tp[0].id : 0,
    idcarstock_damage2: tp[1] ? tp[1].id : 0,
    idcarstock_damage3: tp[2] ? tp[2].id : 0,
    idcarstock_damage4: tp[3] ? tp[3].id : 0,
    idcarstock_damage5: tp[4] ? tp[4].id : 0
  };
}
function parseDigital(s){
  return String(s||'').split(',').map(function(p){ return p.trim(); }).filter(Boolean).map(function(p){ return {path:p}; });
}
function rowToDamage(o){
  const types = [];
  for(let i=1;i<=5;i++){
    const tid = +o['idcarstock_damage'+i] || 0;
    if(tid){
      const meta = DAMAGE_TYPES.find(x=>x.id===tid);
      types.push(meta ? {id:meta.id, name:meta.name, icon:meta.icon} : {id:tid, name:'Type '+tid, icon:'🔧'});
    }
  }
  const x=+o.position_xvalue||0, y=+o.position_yvalue||0, z=+o.position_zvalue||0;
  if(carGroup) carGroup.updateMatrixWorld(true);
  return {
    damageId: +o.damage_id || nextId(),
    x:x, y:y, z:z,
    memo: o.memo || '',
    gravity: +o.damage_level || 2,
    damageTypes: types,
    images: parseDigital(o.digital),
    _world: carGroup ? carGroup.localToWorld(new THREE.Vector3(x,y,z)) : new THREE.Vector3(x,y,z)
  };
}

/* ---- Modifications non enregistrées ----
   __dirty passe à true à chaque changement (dégât ajouté / modifié / supprimé, photo) et
   revient à false quand WinDev recharge les dégâts après un enregistrement réussi.
   WinDev reçoit DIRTY pour demander « Vous n'avez pas enregistré » à la sortie. */
window.__dirty  = false;
window.__saving = false;
function setDirty(v, force){
  v = !!v;
  if (v === window.__dirty && !force) return;
  window.__dirty = v;
  renderDirty();
  envoyerAWinDev(JSON.stringify({ action:'DIRTY', dirty:v, carstock:window.__ctxCarstock, job:window.__ctxJob }));
}
function renderDirty(){
  var b = document.getElementById('dirtyBadge'); if (!b) return;
  b.hidden = !window.__dirty && !window.__saving;
  b.className = window.__saving ? 'saving' : '';
  b.textContent = window.__saving ? t('saving') : t('notSaved');
}
window.estModifie = function(){ return !!window.__dirty; };
window.marquerEnregistre = function(){ window.__saving = false; setDirty(false, true); return 'OK'; };
window.finEnregistrement = function(){ window.__saving = false; renderDirty(); return 'OK'; };

/* Bouton principal : « Enregistrer » dans WinDev (un seul geste, plus besoin de JSON),
   « JSON » (copie presse-papier) dans un navigateur */
function boutonEnregistrer(){
  if (!inWinDev()) { exportJSON(); return; }
  if (!window.__loaded) { flashHint(t('waitDamages')); return; }
  if (window.__saving) return;
  window.__saving = true; renderDirty();
  envoyerAWinDev(construireMessage('GET_DAMAGES_RESPONSE', 'page'));
  setTimeout(function(){ if (window.__saving) { window.__saving = false; renderDirty(); } }, 15000);
}
window.boutonEnregistrer = boutonEnregistrer;

   OnPageMessage, gardent l'ancien comportement), dans un champ HTML WinDev Mobile où l'objet WL est injecté */
var _bridgeWL = /[?&]bridge=wl(&|$)/.test(location.search);
function inWinDev(){
  try { return _bridgeWL && !!(window.WL && typeof window.WL.Execute === 'function'); } catch (e) { return false; }
}

/* setContexte avec 3 paramètres : carstock, job, vehicleModel */
window.setContexte = function (carstock, job, vehicleModel) {
  var newCarstock = parseInt(carstock, 10) || 0, newJob = parseInt(job, 10) || 0;
  if (newCarstock !== window.__ctxCarstock || newJob !== window.__ctxJob) {
    window.__loaded = false; window.__loadAsked = false;   // autre véhicule / OR : dégâts à recharger
  }
  window.__ctxCarstock = newCarstock;
  window.__ctxJob      = newJob;
  if (arguments.length >= 3) window.__ctxModel = parseInt(vehicleModel, 10) || 0;   // setContexte(c, j) garde le verrou
  console.log('[CTX] carstock=' + window.__ctxCarstock + ' job=' + window.__ctxJob + ' model=' + window.__ctxModel);

  // Si un modèle est défini → charger le bon véhicule et verrouiller
  if (window.__ctxModel > 0) {
    var vehicle = VEHICLES.find(function(v) { return v.id === window.__ctxModel; });
    if (!vehicle) {
      // chercher par index numérique (1=premier, 2=deuxième, etc.)
      if (window.__ctxModel <= VEHICLES.length) {
        vehicle = VEHICLES[window.__ctxModel - 1];
      }
    }
    if (vehicle && vehicle.id !== _wantedVehicleId) {
      requestVehicle(vehicle.id);
    }
  }
  renderThumbs();

  return 'CTX:' + window.__ctxCarstock + '/' + window.__ctxJob + '/M' + window.__ctxModel;
};

/* Construit le message tamponné */
function construireMessage(action, origin) {
  var rows = damages.filter(function (d) { return d.damageTypes.length; }).map(damageToRow);

  // Déterminer le modèle à tamponner
  var modelToSave = window.__ctxModel;
  if (modelToSave === 0) {
    // premier save → on note le véhicule actuellement affiché
    var idx = VEHICLES.findIndex(function(v) { return v.id === currentVehicleId; });
    if (idx >= 0) modelToSave = idx + 1;
  }

  // Tamponner [M:X] dans le memo du premier dégât
  if (modelToSave > 0 && rows.length > 0) {
    var first = rows[0];
    if (first.memo.indexOf('[M:') === -1) {
      first.memo = '[M:' + modelToSave + '] ' + first.memo;
    }
  }

  return JSON.stringify({
    action:   action || 'GET_DAMAGES_RESPONSE',
    carstock: window.__ctxCarstock,
    job:      window.__ctxJob,
    count:    rows.length,
    loaded:   !!window.__loaded,
    origin:   origin || 'windev',
    damages:  JSON.stringify(rows),
    deleted:  JSON.stringify(window.__deleted || [])
  });
}

function ecrirePressePapier(txt) {
  var ok = false;
  try {
    var ta = document.createElement('textarea');
    ta.value = txt;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.left = '0';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, txt.length);
    ok = document.execCommand('copy');
    document.body.removeChild(ta);
  } catch (e) { console.warn('[CLIP] execCommand KO', e); }
  if (!ok && navigator.clipboard) {
    try { navigator.clipboard.writeText(txt); ok = true; } catch (e) {}
  }
  console.log('[CLIP] écriture ' + (ok ? 'OK' : 'ÉCHEC'));
  return ok;
}

function envoyerAWinDev(msg) {
  var envoye = false;
  // WinDev Mobile (Android / iOS) : WL.Execute appelle la procédure locale OnPageMessage de la fenêtre.
  // C'est le seul canal qui arrive réellement à WinDev sur tablette (postMessage reste dans la page).
  try { if (inWinDev()) { window.WL.Execute('OnPageMessage', String(msg)); envoye = true; } }
  catch (e) { console.warn('[BRIDGE] WL.Execute KO', e); }
  if (envoye) return true;
  try { window.parent.postMessage(msg, '*'); envoye = true; } catch (e) {}
  try { if (window.parent !== window) window.postMessage(msg, '*'); } catch (e) {}
  try { if (window.WinDev && window.WinDev.postMessage) { window.WinDev.postMessage(msg); envoye = true; } } catch (e) {}
  try { if (window.Android && window.Android.postMessage) { window.Android.postMessage(msg); envoye = true; } } catch (e) {}
  return envoye;
}

window.envoyerSauvegarde = function () {
  if (!window.__ctxJob) { console.warn('[SAVE] contexte absent — WinDev va rejeter'); }
  var msg = construireMessage('GET_DAMAGES_RESPONSE');
  console.log('[SAVE] ' + msg.substring(0, 250));
  envoyerAWinDev(msg);
  ecrirePressePapier(msg);
  return msg;
};

window.copierPourWindev = function () {
  var msg = construireMessage('GET_DAMAGES_RESPONSE');
  ecrirePressePapier(msg);
  return msg;
};

window.effacerTousLesDegats = function () { clearAll(true); window.__deleted = []; return 'CLEARED'; };
window.viderCanvas          = window.effacerTousLesDegats;

/* Diagnostics console */
window.__saveDiag = function () {
  return {
    version: window.__version,
    carstock: window.__ctxCarstock,
    job: window.__ctxJob,
    model: window.__ctxModel,
    total: damages.length,
    valides: damages.filter(function (d) { return d.damageTypes.length; }).length,
    modelReady: _modelReady
  };
};
window.__bridgeDiag = function () {
  return {
    setContexte: typeof window.setContexte,
    envoyerSauvegarde: typeof window.envoyerSauvegarde,
    copierPourWindev: typeof window.copierPourWindev,
    chargerDommages: typeof window.chargerDommages,
    initDamageTypes: typeof window.initDamageTypes,
    parentDifferent: window.parent !== window,
    wlExecute: inWinDev(),
    loaded: window.__loaded, loadAsked: window.__loadAsked, dirty: window.__dirty, saving: window.__saving,
    wanted: _wantedVehicleId, current: currentVehicleId,
    execCommand: typeof document.execCommand
  };
};

/* Annonce à WinDev que la page est prête */
var _readyTries = 0;
function annoncerPret() {
  envoyerAWinDev(JSON.stringify({ action: 'HTML_READY', version: window.__version }));
  // WinDev répond par chargerDommages ; tant qu'il ne l'a pas fait, on redemande (10 essais)
  if (inWinDev() && _readyTries++ < 10) {
    setTimeout(function(){ if (!window.__loadAsked) annoncerPret(); }, 4000);
  }
}
if (document.readyState === 'complete') { setTimeout(annoncerPret, 300); }
else { window.addEventListener('load', function () { setTimeout(annoncerPret, 300); }); }

window.__READY = true;
window.__version = "v26";

window.addEventListener('DOMContentLoaded', function() {
  applyI18n();
  libelleBoutonEnregistrer();
  renderDirty();
});

/* ============ BOUCLE ============ */
function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera); }
function resizeRenderer(){
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if(!w || !h) return;
  camera.aspect = w/h; camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
addEventListener('resize', resizeRenderer);
addEventListener('orientationchange', ()=>{ setTimeout(resizeRenderer, 200); });
if(typeof ResizeObserver !== 'undefined'){
  try{ new ResizeObserver(resizeRenderer).observe(wrap); }catch(e){}
}
renderThumbs();
applyI18n();
if(FILE_MODE){ loadPlaceholder(); }
else { loadVehicleFromFile(currentVehicleId); }
animate();
</script>
