<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marquage des dégâts — iReach (WinDev)</title>
<style>
  :root{
    --bg:#f4f5f7; --panel:#ffffff; --border:#e2e4e9; --text:#1c1e21;
    --muted:#6b7280; --accent:#2f6fb0; --accent-bg:#e6f1fb; --danger:#e24b4a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); overflow:hidden;}
  #app{display:flex; height:100vh;}
  #stage{flex:1; position:relative; background:linear-gradient(#eef1f5,#dfe4ea); min-width:0; min-height:0;}
  #canvasWrap{width:100%; height:100%;}
  #loader{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:12px; background:var(--bg); z-index:20;}
  .spinner{width:34px; height:34px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #hint{position:absolute; top:12px; left:12px; font-size:12px; color:var(--muted); background:var(--panel); padding:5px 12px; border-radius:8px; border:1px solid var(--border); z-index:10;}
  #side{width:280px; background:var(--panel); border-left:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden;}

  /* PORTRAIT / écran étroit : on empile (voiture en haut, panneau en bas) au lieu de côte à côte */
  @media (orientation: portrait), (max-width: 680px){
    #app{flex-direction:column;}
    #stage{flex:1 1 auto; min-height:58%;}
    #side{width:100%; flex:0 0 auto; max-height:40%; border-left:none; border-top:1px solid var(--border);}
    .thumbs{grid-template-columns:1fr 1fr 1fr;}
  }
  .sec{padding:14px 16px; border-bottom:1px solid var(--border);}
  .sec h3{font-size:12px; text-transform:uppercase; letter-spacing:0.04em; color:var(--muted); margin-bottom:10px; font-weight:600;}
  .thumbs{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}
  .thumb{padding:10px 4px; font-size:11px; text-align:center; border:1px solid var(--border); border-radius:8px; background:var(--panel); cursor:pointer; transition:.15s;}
  .thumb.active{border:2px solid var(--accent); background:var(--accent-bg); color:var(--accent); font-weight:600;}
  .thumb .ic{font-size:20px; display:block; margin-bottom:4px;}
  #dmgList{flex:1; overflow:auto; padding:8px 12px;}
  .dmgRow{display:flex; align-items:center; gap:8px; padding:8px 10px; border:1px solid var(--border); border-radius:8px; margin-bottom:6px; font-size:12px; cursor:pointer;}
  .dmgRow:hover{border-color:var(--accent);}
  .dmgRow .id{color:var(--muted); font-weight:600;}
  .dmgRow .co{margin-left:auto; font-family:ui-monospace,monospace; font-size:10px; color:var(--muted);}
  .dmgRow .del{color:var(--danger); cursor:pointer; padding:0 4px;}
  .gravDot{width:9px; height:9px; border-radius:50%; flex:none;}
  .actions{padding:12px 16px; border-top:1px solid var(--border); display:flex; gap:8px;}
  button.btn{flex:1; padding:9px; font-size:13px; border:1px solid var(--border); border-radius:8px; background:var(--panel); cursor:pointer;}
  button.btn:hover{background:var(--bg);}
  button.btn.primary{background:var(--accent); color:#fff; border-color:var(--accent);}
  #popup{position:absolute; z-index:30; width:188px; background:var(--panel); border:1px solid var(--border); border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.18); display:none; overflow:hidden;}
  #popup .ph{padding:6px 10px; border-bottom:1px solid var(--border); font-size:12px; font-weight:600; display:flex; align-items:center; justify-content:space-between;}
  #popup .ph .x{cursor:pointer; color:var(--muted); font-size:16px;}
  #popup .pb{padding:8px 10px; max-height:260px; overflow:auto;}
  .plabel{font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:2px 0 4px; font-weight:600;}
  .typeItem{display:flex; align-items:center; gap:6px; padding:4px 7px; border:1px solid var(--border); border-radius:6px; margin-bottom:3px; font-size:12px; cursor:pointer;}
  .typeItem.on{border-color:var(--accent); background:var(--accent-bg); color:var(--accent);}
  .typeItem .chk{margin-left:auto;}
  .gravRow{display:flex; gap:5px; margin-top:2px;}
  .gravBtn{flex:1; padding:4px 0; font-size:11px; text-align:center; border:1px solid var(--border); border-radius:6px; cursor:pointer;}
  .gravBtn.on{color:#fff; font-weight:600; border-color:transparent;}
  #popup .pf{padding:8px 10px; border-top:1px solid var(--border); display:flex; gap:6px;}
  #popup .pf button{flex:1; padding:6px; font-size:12px; border-radius:6px; cursor:pointer; border:1px solid var(--border); background:var(--panel);}
  #popup .pf button.ok{background:var(--accent); color:#fff; border-color:var(--accent);}
  textarea#memo{width:100%; border:1px solid var(--border); border-radius:6px; padding:5px 7px; font-size:11px; font-family:inherit; resize:vertical; min-height:28px; margin-top:2px;}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="canvasWrap"></div>
    <div id="hint">Clic sur la carrosserie = poser un dégât · glisser = pivoter · molette = zoom</div>
    <div id="loader"><div class="spinner"></div><div id="loadTxt" style="font-size:13px;color:var(--muted)">Initialisation…</div></div>
    <div id="popup">
      <div class="ph"><span id="popupTitle">Dégât #1</span><span class="x" onclick="closePopup(true)">✕</span></div>
      <div class="pb">
        <div class="plabel">Types (max 5)</div>
        <div id="typeList"></div>
        <div class="plabel" style="margin-top:8px;">Gravité</div>
        <div class="gravRow" id="gravRow"></div>
        <div class="plabel" style="margin-top:8px;">Note</div>
        <textarea id="memo" placeholder="Commentaire optionnel…"></textarea>
      </div>
      <div class="pf">
        <button onclick="closePopup(true)">Annuler</button>
        <button class="ok" onclick="confirmPopup()">Valider</button>
      </div>
    </div>
  </div>
  <div id="side">
    <div class="sec">
      <h3>Modèle de véhicule</h3>
      <div class="thumbs" id="thumbs"></div>
    </div>
    <div class="sec" style="flex:1; display:flex; flex-direction:column; padding-bottom:0;">
      <h3>Dégâts posés (<span id="cnt">0</span>)</h3>
      <div id="dmgList"></div>
    </div>
    <div class="actions">
      <button class="btn" onclick="clearAll()">Tout effacer</button>
      <button class="btn primary" onclick="exportJSON()">JSON</button>
    </div>
  </div>
</div>

<!-- ================================================================
     LIBRAIRIES
     Les <script src> fonctionnent en file:// (pas de restriction CORS).
     - Par défaut : depuis un CDN (nécessite internet).
     - Pour un poste WinDev SANS internet : télécharge ces 4 fichiers
       dans un sous-dossier ./libs/ et remplace les URLs par des chemins
       relatifs, ex :  <script src="libs/three.min.js"></script>
     ================================================================ -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* ============ DÉTECTION DU CONTEXTE ============
   file://  -> WinDev ou double-clic : on NE PEUT PAS charger un .glb par requête XHR.
               On attend que WinDev pousse le modèle via loadVehicleGLB(base64,...).
   http(s)  -> test navigateur avec serveur local : on charge peugeot308.glb par fichier. */
const FILE_MODE = (location.protocol === 'file:');

/* ============ DONNÉES ============ */
const DAMAGE_TYPES = [
  {id:1,name:'Rust',icon:'🦠'},{id:2,name:'Dent',icon:'🔨'},
  {id:3,name:'Hail',icon:'❄️'},{id:4,name:'Birdpoop',icon:'💩'},
  {id:5,name:'Scratch',icon:'✏️'},{id:6,name:'Windshield crack',icon:'💠'},
  {id:7,name:'Windshield star',icon:'✴️'},
];
const GRAVITIES = [
  {id:1,name:'Léger',color:'#5dcaa5'},
  {id:2,name:'Moyen',color:'#ef9f27'},
  {id:3,name:'Grave',color:'#e24b4a'},
];
/* Un seul véhicule pour l'instant. Pour en ajouter : pousser un nouvel objet
   { id, label, file } dans VEHICLES et déposer le .glb à côté du HTML. */
const VEHICLES = [
  {id:'peugeot308', label:'Peugeot 308', file:'peugeot308.glb'},
];

let damages = [];
let currentVehicleId = VEHICLES[0].id;
let editingIndex = null;
let draftTypes = [], draftGravity = 2;

/* ============ THREE.JS ============ */
const wrap = document.getElementById('canvasWrap');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, wrap.clientWidth/wrap.clientHeight, 0.01, 1000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(wrap.clientWidth, wrap.clientHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
wrap.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x888888, 0.9));
const d1=new THREE.DirectionalLight(0xffffff,0.8); d1.position.set(5,10,7); scene.add(d1);
const d2=new THREE.DirectionalLight(0xffffff,0.4); d2.position.set(-5,4,-6); scene.add(d2);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;

const dracoLoader = new THREE.DRACOLoader();
dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/draco/');
const gltfLoader = new THREE.GLTFLoader();
gltfLoader.setDRACOLoader(dracoLoader);

let carGroup = null;
let bodyMeshes = [];
const markerGroup = new THREE.Group(); scene.add(markerGroup);

/* ---- Loader visuel ---- */
function showLoader(txt){ document.getElementById('loader').style.display='flex';
  if(txt) document.getElementById('loadTxt').textContent=txt; }
function hideLoader(){ document.getElementById('loader').style.display='none'; }

/* ---- Applique un modèle (gltf déjà parsé) à la scène ----
   ready=false pour le placeholder : n'active pas le flush des dégâts en attente,
   ils seront reposés quand le vrai modèle arrivera via loadVehicleGLB. */
function applyGltf(gltf, id, label, ready){
  if(carGroup) scene.remove(carGroup);
  carGroup = gltf.scene;
  bodyMeshes = [];
  carGroup.traverse(o=>{ if(o.isMesh){ o.geometry.computeBoundingBox(); bodyMeshes.push(o);} });
  const box = new THREE.Box3().setFromObject(carGroup);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const scale = 4 / Math.max(size.x,size.y,size.z);
  carGroup.scale.setScalar(scale);
  carGroup.position.sub(center.multiplyScalar(scale));
  carGroup.position.y += (size.y*scale)/2;
  scene.add(carGroup);
  currentVehicleId = id;
  if(label){ const v=VEHICLES.find(x=>x.id===id); if(v) v.label=label; }
  clearAll(true);
  renderThumbs();
  controls.target.set(0, size.y*scale/2, 0);
  camera.position.set(size.x*scale*1.2, size.y*scale*1.1, size.z*scale*1.4);
  controls.update();
  hideLoader();
  if(ready !== false){
    _modelReady = true;
    if(_pendingLoad){ const p = _pendingLoad; _pendingLoad = null; window.chargerDommages(p); }
  }
}

/* ---- base64 -> ArrayBuffer (tolère espaces/retours ligne) ---- */
function b64ToArrayBuffer(b64){
  const clean = String(b64).replace(/\s+/g,'');
  const bin = atob(clean);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return bytes.buffer;
}

/* ---- Parse un GLB depuis des octets (fonctionne en file://) ---- */
function parseGLB(buffer, id, label){
  showLoader('Décodage du modèle…');
  gltfLoader.parse(buffer, '', gltf=>applyGltf(gltf,id,label),
    err=>{ showLoader('Erreur de parsing du modèle (voir console)'); console.error(err); });
}

/* ---- MODE DEV (serveur HTTP) : charge depuis un fichier ---- */
function loadVehicleFromFile(id){
  const v = VEHICLES.find(x=>x.id===id);
  showLoader('Chargement '+v.label+'…');
  gltfLoader.load(v.file, gltf=>applyGltf(gltf,id), undefined,
    err=>{ showLoader('Erreur de chargement — sers le dossier en HTTP'); console.error(err); });
}

/* ---- Placeholder procédural (aucun fichier requis) ---- */
function loadPlaceholder(){
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({color:0x9fb4c8, metalness:0.25, roughness:0.6});
  const body  = new THREE.Mesh(new THREE.BoxGeometry(2,0.6,4), mat);   body.position.y=0.5;
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.6,0.5,2), mat.clone()); cabin.position.set(0,0.95,-0.2);
  g.add(body, cabin);
  applyGltf({scene:g}, currentVehicleId, null, false);
  showLoader('En attente du modèle depuis WinDev…'); setTimeout(hideLoader, 600);
}

/* ---- Aiguillage clic vignette ----
   HTTP  : on charge le .glb depuis le disque à côté du HTML.
   file: : on demande à WinDev de pousser le modèle (loadVehicleGLB). */
function requestVehicle(id){
  if(FILE_MODE){
    if(typeof window.__onVehiclePick==='function') window.__onVehiclePick(id);
  } else {
    loadVehicleFromFile(id);
  }
}

/* ============ RAYCAST / POSE ============ */
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let downPos=null;
renderer.domElement.addEventListener('pointerdown', e=>{ downPos={x:e.clientX,y:e.clientY}; });
renderer.domElement.addEventListener('pointerup', e=>{
  if(!downPos) return;
  const moved = Math.hypot(e.clientX-downPos.x, e.clientY-downPos.y);
  downPos=null;
  if(moved>5) return;
  if(!carGroup) return;
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX-rect.left)/rect.width)*2-1;
  mouse.y = -((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(bodyMeshes, true);
  if(!hits.length) return;
  const local = carGroup.worldToLocal(hits[0].point.clone());
  const dmg = {
    damageId: nextId(),
    x:+local.x.toFixed(4), y:+local.y.toFixed(4), z:+local.z.toFixed(4),
    memo:'', gravity:2, damageTypes:[], _world:hits[0].point.clone()
  };
  damages.push(dmg);
  addMarker(dmg);
  openPopup(damages.length-1, e.clientX, e.clientY);
});

function nextId(){ return damages.reduce((m,d)=>Math.max(m,d.damageId),0)+1; }

function addMarker(dmg){
  const grav = GRAVITIES.find(g=>g.id===dmg.gravity)||GRAVITIES[1];
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(0.06,16,16),
    new THREE.MeshBasicMaterial({color:new THREE.Color(grav.color)})
  );
  m.position.copy(dmg._world);
  m.renderOrder = 999;
  m.material.depthTest = false;
  markerGroup.add(m);
  dmg._marker = m;
}
function refreshMarker(dmg){
  const grav = GRAVITIES.find(g=>g.id===dmg.gravity)||GRAVITIES[1];
  if(dmg._marker) dmg._marker.material.color = new THREE.Color(grav.color);
}

/* ============ POPUP CONTEXTUEL ============ */
function openPopup(index, screenX, screenY){
  editingIndex = index;
  const d = damages[index];
  draftTypes = d.damageTypes.map(t=>t.id);
  draftGravity = d.gravity;
  document.getElementById('popupTitle').textContent='Dégât #'+d.damageId;
  document.getElementById('memo').value = d.memo||'';
  renderTypeList(); renderGravRow();
  const pop = document.getElementById('popup');
  pop.style.display='block';
  const stage = document.getElementById('stage').getBoundingClientRect();
  // le contenu ne dépasse jamais l'écran → header + contenu + boutons toujours visibles
  const pb = pop.querySelector('.pb');
  if (pb) pb.style.maxHeight = Math.max(110, stage.height - 96) + 'px';
  const pw = pop.offsetWidth || 188;   // vraie largeur du popup
  const ph = pop.offsetHeight || 300;  // vraie hauteur du popup (mesurée)
  let x = (screenX!==undefined? screenX-stage.left+14 : (stage.width-pw)/2);
  let y = (screenY!==undefined? screenY-stage.top-10 : 40);
  // garder TOUT le popup dans le cadre (bouton Valider toujours visible), marge 8px
  x = Math.max(8, Math.min(x, stage.width  - pw - 8));
  y = Math.max(8, Math.min(y, stage.height - ph - 8));
  pop.style.left=x+'px'; pop.style.top=y+'px';
}
function renderTypeList(){
  const box=document.getElementById('typeList'); box.innerHTML='';
  DAMAGE_TYPES.forEach(t=>{
    const on=draftTypes.includes(t.id);
    const el=document.createElement('div');
    el.className='typeItem'+(on?' on':'');
    el.innerHTML='<span>'+t.icon+'</span><span>'+t.name+'</span><span class="chk">'+(on?'✓':'')+'</span>';
    el.onclick=()=>{
      if(on) draftTypes=draftTypes.filter(x=>x!==t.id);
      else { if(draftTypes.length>=5){alert('Maximum 5 types');return;} draftTypes.push(t.id); }
      renderTypeList();
    };
    box.appendChild(el);
  });
}
function renderGravRow(){
  const box=document.getElementById('gravRow'); box.innerHTML='';
  GRAVITIES.forEach(g=>{
    const on=draftGravity===g.id;
    const el=document.createElement('div');
    el.className='gravBtn'+(on?' on':'');
    if(on) el.style.background=g.color;
    el.textContent=g.name;
    el.onclick=()=>{ draftGravity=g.id; renderGravRow(); };
    box.appendChild(el);
  });
}
function confirmPopup(){
  const d=damages[editingIndex];
  if(draftTypes.length===0){ alert('Sélectionne au moins un type'); return; }
  d.damageTypes = draftTypes.map(id=>{const t=DAMAGE_TYPES.find(x=>x.id===id); return {id:t.id,name:t.name,icon:t.icon};});
  d.gravity = draftGravity;
  d.memo = document.getElementById('memo').value;
  refreshMarker(d);
  closePopup(false);
  renderDmgList();
}
function closePopup(cancel){
  if(cancel && editingIndex!==null){
    const d=damages[editingIndex];
    if(d && d.damageTypes.length===0){ markerGroup.remove(d._marker); damages.splice(editingIndex,1); }
  }
  editingIndex=null;
  document.getElementById('popup').style.display='none';
  renderDmgList();
}

/* ============ LISTE LATÉRALE ============ */
function renderDmgList(){
  const box=document.getElementById('dmgList'); box.innerHTML='';
  document.getElementById('cnt').textContent=damages.filter(d=>d.damageTypes.length).length;
  damages.forEach((d,i)=>{
    if(d.damageTypes.length===0) return;
    const grav=GRAVITIES.find(g=>g.id===d.gravity)||GRAVITIES[1];
    const row=document.createElement('div'); row.className='dmgRow';
    row.innerHTML='<span class="gravDot" style="background:'+grav.color+'"></span>'+
      '<span class="id">#'+d.damageId+'</span>'+
      '<span>'+d.damageTypes.map(t=>t.icon).join('')+'</span>'+
      '<span class="co">'+d.x+','+d.y+','+d.z+'</span>';
    row.onclick=(e)=>{ if(e.target.classList.contains('del'))return; openPopup(i); };
    const del=document.createElement('span'); del.className='del'; del.textContent='✕';
    del.onclick=(e)=>{ e.stopPropagation(); markerGroup.remove(d._marker); damages.splice(i,1); renderDmgList(); };
    row.appendChild(del);
    box.appendChild(row);
  });
}
function renderThumbs(){
  const box=document.getElementById('thumbs'); box.innerHTML='';
  VEHICLES.forEach(v=>{
    const el=document.createElement('div');
    el.className='thumb'+(v.id===currentVehicleId?' active':'');
    el.innerHTML='<span class="ic">🚗</span>'+v.label;
    el.onclick=()=>{ if(v.id!==currentVehicleId) requestVehicle(v.id); };
    box.appendChild(el);
  });
}
function clearAll(silent){
  if(!silent && damages.filter(d=>d.damageTypes.length).length && !confirm('Effacer tous les dégâts ?')) return;
  damages=[]; while(markerGroup.children.length) markerGroup.remove(markerGroup.children[0]);
  renderDmgList();
}
function exportJSON(){
  const rows = damages.filter(d=>d.damageTypes.length).map(damageToRow);
  const s = JSON.stringify(rows, null, 2);
  navigator.clipboard && navigator.clipboard.writeText(s);
  alert('JSON copié dans le presse-papier :\n\n'+s);
  return s;
}

/* ============ MAPPING PAGE ↔ BASE DE DONNÉES ============
   La page manipule en interne : {damageId, x, y, z, gravity, memo, damageTypes:[{id,name,icon}...]}
   La base attend : {damage_id, position_xvalue, position_yvalue, position_zvalue,
                     damage_level, memo, idcarstock_damage1..5 (0 si vide)}
   Ces deux helpers font le pont dans les deux sens, utilisés par le presse-papier
   et par les hooks WinDev. Les colonnes remplies par WinDev (numberjob, numbercarstock,
   lastmodifieddatetime, lastmodifiedby, IDCarstock_damage_detail auto, ck… auto)
   ne sont PAS dans ce JSON — elles sont ajoutées côté WinDev à l'insertion. */
function damageToRow(d){
  const t = d.damageTypes || [];
  return {
    damage_id: d.damageId,
    position_xvalue: d.x,
    position_yvalue: d.y,
    position_zvalue: d.z,
    damage_level: d.gravity,
    memo: d.memo || '',
    idcarstock_damage1: t[0] ? t[0].id : 0,
    idcarstock_damage2: t[1] ? t[1].id : 0,
    idcarstock_damage3: t[2] ? t[2].id : 0,
    idcarstock_damage4: t[3] ? t[3].id : 0,
    idcarstock_damage5: t[4] ? t[4].id : 0
  };
}
function rowToDamage(o){
  const types = [];
  for(let i=1;i<=5;i++){
    const tid = +o['idcarstock_damage'+i] || 0;
    if(tid){
      const meta = DAMAGE_TYPES.find(x=>x.id===tid);
      if(meta) types.push({id:meta.id, name:meta.name, icon:meta.icon});
    }
  }
  const x=+o.position_xvalue, y=+o.position_yvalue, z=+o.position_zvalue;
  return {
    damageId: +o.damage_id || nextId(),
    x:x, y:y, z:z,
    memo: o.memo || '',
    gravity: +o.damage_level || 2,
    damageTypes: types,
    _world: carGroup ? carGroup.localToWorld(new THREE.Vector3(x,y,z)) : new THREE.Vector3(x,y,z)
  };
}

/* File d'attente : si WinDev pousse les dégâts avant que le modèle 3D soit prêt,
   on les mémorise ici et on les rejoue automatiquement dès applyGltf du vrai modèle. */
let _modelReady = false;
let _pendingLoad = null;

/* ============ HOOKS WINDEV (appelés via ExecuteJS) ============ */

/* WinDev lit le .glb, l'encode en base64 et appelle ceci.
   C'est LE point d'entrée principal en production. */
window.loadVehicleGLB = function(base64, id, label){
  try{ parseGLB(b64ToArrayBuffer(base64), id||currentVehicleId, label||null); }
  catch(e){ showLoader('Erreur base64 (voir console)'); console.error(e); }
};

/* Remplace la liste de types (globale gtabMyDamages) : [{id,name,icon}, ...] */
window.initDamageTypes = function(json){
  try{ const arr=typeof json==='string'?JSON.parse(json):json;
    DAMAGE_TYPES.length=0; arr.forEach(t=>DAMAGE_TYPES.push(t)); }catch(e){console.error(e);}
};

/* Recharge les dégâts d'un OR à l'ouverture de la fiche.
   Appelable AVANT que le modèle 3D soit chargé : la donnée est mise en attente
   et sera appliquée automatiquement dès que le modèle est prêt. */
window.chargerDommages = function(json){
  if(!_modelReady){ _pendingLoad = json; return; }
  try{
    const arr = typeof json==='string' ? JSON.parse(json) : json;
    clearAll(true);
    (arr||[]).forEach(o => { const d = rowToDamage(o); damages.push(d); addMarker(d); });
    renderDmgList();
  }catch(e){console.error(e);}
};

/* WinDev récupère toute la liste au moment d'enregistrer.
   Clés = noms de colonnes de Carstock_damage_detail (mapping via damageToRow). */
window.getDamagesJSON = function(){
  return JSON.stringify(damages.filter(d=>d.damageTypes.length).map(damageToRow));
};

/* Optionnel : signaler à WinDev que la page est prête à recevoir un modèle. */
window.__READY = true;

/* ============ BOUCLE ============ */
function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera); }
function resizeRenderer(){
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if(!w || !h) return;
  camera.aspect = w/h; camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
addEventListener('resize', resizeRenderer);
addEventListener('orientationchange', ()=>{ setTimeout(resizeRenderer, 200); });
// suit la vraie taille du conteneur même quand la fenêtre ne déclenche pas 'resize' (champ WinDev)
if(typeof ResizeObserver !== 'undefined'){
  try{ new ResizeObserver(resizeRenderer).observe(wrap); }catch(e){}
}
renderThumbs();
if(FILE_MODE){ loadPlaceholder(); }              // WinDev / double-clic → attend le push loadVehicleGLB
else { loadVehicleFromFile(currentVehicleId); }  // serveur HTTP → charge peugeot308.glb directement
animate();
</script>
</body>
