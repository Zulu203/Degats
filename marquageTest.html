<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marquage des dégâts — iReach (WinDev)</title>
<style>
  :root{
    --bg:#f4f5f7; --panel:#ffffff; --border:#e2e4e9; --text:#1c1e21;
    --muted:#6b7280; --accent:#2f6fb0; --accent-bg:#e6f1fb; --danger:#e24b4a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); overflow:hidden;}
  #app{display:flex; height:100vh;}
  #stage{flex:1; position:relative; background:linear-gradient(#eef1f5,#dfe4ea); min-width:0; min-height:0;}
  #canvasWrap{width:100%; height:100%;}
  #loader{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:12px; background:var(--bg); z-index:20;}
  .spinner{width:34px; height:34px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #hint{position:absolute; top:12px; left:12px; font-size:12px; color:var(--muted); background:var(--panel); padding:5px 12px; border-radius:8px; border:1px solid var(--border); z-index:10;}
  #side{width:280px; background:var(--panel); border-left:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden;}

  @media (orientation: portrait), (max-width: 680px){
    #app{flex-direction:column;}
    #stage{flex:1 1 auto; min-height:58%;}
    #side{width:100%; flex:0 0 auto; max-height:40%; border-left:none; border-top:1px solid var(--border);}
    .thumbs{grid-template-columns:1fr 1fr 1fr;}
  }
  .sec{padding:14px 16px; border-bottom:1px solid var(--border);}
  .sec h3{font-size:12px; text-transform:uppercase; letter-spacing:0.04em; color:var(--muted); margin-bottom:10px; font-weight:600;}
  .thumbs{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}
  .thumb{padding:10px 4px; font-size:11px; text-align:center; border:1px solid var(--border); border-radius:8px; background:var(--panel); cursor:pointer; transition:.15s;}
  .thumb.active{border:2px solid var(--accent); background:var(--accent-bg); color:var(--accent); font-weight:600;}
  .thumb.locked{opacity:0.3; cursor:not-allowed; pointer-events:none;}
  .thumb .ic{font-size:20px; display:block; margin-bottom:4px;}
  #dmgList{flex:1; overflow:auto; padding:8px 12px;}
  .dmgRow{display:flex; align-items:center; gap:8px; padding:8px 10px; border:1px solid var(--border); border-radius:8px; margin-bottom:6px; font-size:12px; cursor:pointer;}
  .dmgRow:hover{border-color:var(--accent);}
  .dmgRow .id{color:var(--muted); font-weight:600;}
  .dmgRow .co{margin-left:auto; font-family:ui-monospace,monospace; font-size:10px; color:var(--muted);}
  .dmgRow .del{color:var(--danger); cursor:pointer; padding:0 4px;}
  .gravDot{width:9px; height:9px; border-radius:50%; flex:none;}
  .actions{padding:12px 16px; border-top:1px solid var(--border); display:flex; gap:8px;}
  button.btn{flex:1; padding:9px; font-size:13px; border:1px solid var(--border); border-radius:8px; background:var(--panel); cursor:pointer;}
  button.btn:hover{background:var(--bg);}
  button.btn.primary{background:var(--accent); color:#fff; border-color:var(--accent);}
  #popup{position:absolute; z-index:30; width:188px; background:var(--panel); border:1px solid var(--border); border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.18); display:none; overflow:hidden;}
  #popup .ph{padding:6px 10px; border-bottom:1px solid var(--border); font-size:12px; font-weight:600; display:flex; align-items:center; justify-content:space-between;}
  #popup .ph .x{cursor:pointer; color:var(--muted); font-size:16px;}
  #popup .pb{padding:8px 10px; max-height:260px; overflow:auto;}
  .plabel{font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:2px 0 4px; font-weight:600;}
  .typeItem{display:flex; align-items:center; gap:6px; padding:4px 7px; border:1px solid var(--border); border-radius:6px; margin-bottom:3px; font-size:12px; cursor:pointer;}
  .typeItem.on{border-color:var(--accent); background:var(--accent-bg); color:var(--accent);}
  .typeItem .chk{margin-left:auto;}
  .gravRow{display:flex; gap:5px; margin-top:2px;}
  .gravBtn{flex:1; padding:4px 0; font-size:11px; text-align:center; border:1px solid var(--border); border-radius:6px; cursor:pointer;}
  .gravBtn.on{color:#fff; font-weight:600; border-color:transparent;}
  #popup .pf{padding:8px 10px; border-top:1px solid var(--border); display:flex; gap:6px;}
  #popup .pf button{flex:1; padding:6px; font-size:12px; border-radius:6px; cursor:pointer; border:1px solid var(--border); background:var(--panel);}
  #popup .pf button.ok{background:var(--accent); color:#fff; border-color:var(--accent);}
  textarea#memo{width:100%; border:1px solid var(--border); border-radius:6px; padding:5px 7px; font-size:11px; font-family:inherit; resize:vertical; min-height:28px; margin-top:2px;}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="canvasWrap"></div>
    <div id="hint"></div>
    <div id="loader"><div class="spinner"></div><div id="loadTxt" style="font-size:13px;color:var(--muted)"></div></div>
    <div id="popup">
      <div class="ph"><span id="popupTitle"></span><span class="x" onclick="closePopup(true)">✕</span></div>
      <div class="pb">
        <div class="plabel" id="lblTypes"></div>
        <div id="typeList"></div>
        <div class="plabel" id="lblGravity" style="margin-top:8px;"></div>
        <div class="gravRow" id="gravRow"></div>
        <div class="plabel" id="lblNote" style="margin-top:8px;"></div>
        <textarea id="memo"></textarea>
      </div>
      <div class="pf">
        <button id="btnPopupCancel" onclick="closePopup(true)"></button>
        <button class="ok" id="btnPopupOk" onclick="confirmPopup()"></button>
      </div>
    </div>
  </div>
  <div id="side">
    <div class="sec">
      <h3 id="lblVehicle"></h3>
      <div class="thumbs" id="thumbs"></div>
    </div>
    <div class="sec" style="flex:1; display:flex; flex-direction:column; padding-bottom:0;">
      <h3><span id="lblDamages"></span> (<span id="cnt">0</span>)</h3>
      <div id="dmgList"></div>
    </div>
    <div class="actions">
      <button class="btn" id="btnClearAll" onclick="clearAll()"></button>
      <button class="btn" id="btnCharger" onclick="demanderChargement()"></button>
      <button class="btn primary" onclick="exportJSON()">JSON</button>
    </div>
  </div>
</div>

<!-- ============ LANGUE : toujours charger FR (maître) + la langue choisie ============ -->
<script src="lang_fr.js"></script>
<script>
  /* Sauvegarder le français comme base avant que le fichier suivant écrase LANG_DATA */
  var LANG_FR = {};
  if (typeof LANG_DATA !== 'undefined') {
    for (var _k in LANG_DATA) LANG_FR[_k] = LANG_DATA[_k];
  }
</script>
<script>
  /* Charger le fichier de la langue choisie (si pas FR, sinon LANG_DATA reste le FR) */
  var _urlLang = new URLSearchParams(window.location.search).get('lang') || 'fr';
  if (_urlLang !== 'fr') {
    document.write('<script src="lang_' + _urlLang + '.js"><\/script>');
  }
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>

/* ============ i18n — FICHIERS EXTERNES ============
   Fichiers : lang_fr.js (maître), lang_nl.js, lang_en.js
   Chacun expose var LANG_DATA = { ... }
   Le français est chargé EN PREMIER via <script>, puis la langue
   choisie par-dessus. Les clés manquantes tombent sur le français. */

/* LANG_FR = copie du français (chargé par lang_fr.js avant ce script) */
var LANG_FR = {};
var T = {};

function initI18n() {
  // LANG_DATA a été écrasé par le dernier <script lang_xx.js> chargé
  // On fusionne : français d'abord, puis la langue choisie par-dessus
  for (var k in LANG_FR) { T[k] = LANG_FR[k]; }        // base = français
  if (typeof LANG_DATA !== 'undefined') {
    for (var k in LANG_DATA) { T[k] = LANG_DATA[k]; }   // surcharge avec la langue choisie
  }
}

function t(key, replacements) {
  var s = T[key] || key;
  if (replacements) {
    for (var k in replacements) {
      s = s.replace('%' + k, replacements[k]);
    }
  }
  return s;
}

/* Initialiser les traductions (fusionner FR + langue choisie) */
initI18n();

/* ============ APPLIQUER LES TEXTES i18n AU DOM ============ */
function applyI18n() {
  document.getElementById('hint').textContent = t('hint');
  document.getElementById('loadTxt').textContent = t('loading');
  document.getElementById('lblVehicle').textContent = t('lblVehicle');
  document.getElementById('lblDamages').textContent = t('lblDamages');
  document.getElementById('lblTypes').textContent = t('lblTypes');
  document.getElementById('lblGravity').textContent = t('lblGravity');
  document.getElementById('lblNote').textContent = t('lblNote');
  document.getElementById('btnClearAll').textContent = t('btnClearAll');
  document.getElementById('btnCharger').textContent = t('btnCharger');
  document.getElementById('btnPopupCancel').textContent = t('btnCancel');
  document.getElementById('btnPopupOk').textContent = t('btnOk');
  document.getElementById('memo').placeholder = t('memoPlaceholder');
}

/* ============ DÉTECTION DU CONTEXTE ============ */
const FILE_MODE = (location.protocol === 'file:');

/* ============ DONNÉES ============ */
const DAMAGE_TYPES = [
  {id:1,name:'Rust',icon:'🦠'},{id:2,name:'Dent',icon:'🔨'},
  {id:3,name:'Hail',icon:'❄️'},{id:4,name:'Birdpoop',icon:'💩'},
  {id:5,name:'Scratch',icon:'✏️'},{id:6,name:'Windshield crack',icon:'💠'},
  {id:7,name:'Windshield star',icon:'✴️'},
];
const GRAVITIES = [
  {id:1,color:'#5dcaa5'},
  {id:2,color:'#ef9f27'},
  {id:3,color:'#e24b4a'},
];
/* Libellés de gravité traduits (fonction, pas constante, car T peut changer) */
function gravName(id) {
  if (id === 1) return t('sevLow');
  if (id === 2) return t('sevMedium');
  if (id === 3) return t('sevHigh');
  return '';
}

const VEHICLES = [
  {id:'peugeot308', label:'Peugeot 308', file:'peugeot308.glb'},
  {id:'hyundai_tucson', label:'Hyundai Tucson', file:'hyundai_tucson.glb'},
  {id:'volkswagen_van_t6', label:'Volkswagen Van T6', file:'volkswagen_van_t6.glb'}
];

let damages = [];
let currentVehicleId = VEHICLES[0].id;
let editingIndex = null;
let draftTypes = [], draftGravity = 2;

/* ============ THREE.JS ============ */
const wrap = document.getElementById('canvasWrap');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, wrap.clientWidth/wrap.clientHeight, 0.01, 1000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(wrap.clientWidth, wrap.clientHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
wrap.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x888888, 0.9));
const d1=new THREE.DirectionalLight(0xffffff,0.8); d1.position.set(5,10,7); scene.add(d1);
const d2=new THREE.DirectionalLight(0xffffff,0.4); d2.position.set(-5,4,-6); scene.add(d2);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;

const dracoLoader = new THREE.DRACOLoader();
dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/draco/');
const gltfLoader = new THREE.GLTFLoader();
gltfLoader.setDRACOLoader(dracoLoader);

let carGroup = null;
let bodyMeshes = [];
const markerGroup = new THREE.Group(); scene.add(markerGroup);

/* ---- Loader visuel ---- */
function showLoader(txt){ document.getElementById('loader').style.display='flex';
  if(txt) document.getElementById('loadTxt').textContent=txt; }
function hideLoader(){ document.getElementById('loader').style.display='none'; }

function applyGltf(gltf, id, label, ready){
  if(carGroup) scene.remove(carGroup);
  carGroup = gltf.scene;
  bodyMeshes = [];
  carGroup.traverse(o=>{ if(o.isMesh){ o.geometry.computeBoundingBox(); bodyMeshes.push(o);} });
  const box = new THREE.Box3().setFromObject(carGroup);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const scale = 4 / Math.max(size.x,size.y,size.z);
  carGroup.scale.setScalar(scale);
  carGroup.position.sub(center.multiplyScalar(scale));
  carGroup.position.y += (size.y*scale)/2;
  scene.add(carGroup);
  currentVehicleId = id;
  if(label){ const v=VEHICLES.find(x=>x.id===id); if(v) v.label=label; }
  clearAll(true);
  renderThumbs();
  controls.target.set(0, size.y*scale/2, 0);
  camera.position.set(size.x*scale*1.2, size.y*scale*1.1, size.z*scale*1.4);
  controls.update();
  hideLoader();
  if(ready !== false){
    _modelReady = true;
    if(_pendingLoad){ const p = _pendingLoad; _pendingLoad = null; window.chargerDommages(p); }
  }
}

function b64ToArrayBuffer(b64){
  const clean = String(b64).replace(/\s+/g,'');
  const bin = atob(clean);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return bytes.buffer;
}

function parseGLB(buffer, id, label){
  showLoader(t('decoding'));
  gltfLoader.parse(buffer, '', gltf=>applyGltf(gltf,id,label),
    err=>{ showLoader(t('errParse')); console.error(err); });
}

function loadVehicleFromFile(id){
  const v = VEHICLES.find(x=>x.id===id);
  showLoader(t('loadingModel')+v.label+'…');
  gltfLoader.load(v.file, gltf=>applyGltf(gltf,id), undefined,
    err=>{ showLoader(t('errLoad')); console.error(err); });
}

function loadPlaceholder(){
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({color:0x9fb4c8, metalness:0.25, roughness:0.6});
  const body  = new THREE.Mesh(new THREE.BoxGeometry(2,0.6,4), mat);   body.position.y=0.5;
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.6,0.5,2), mat.clone()); cabin.position.set(0,0.95,-0.2);
  g.add(body, cabin);
  applyGltf({scene:g}, currentVehicleId, null, false);
  showLoader(t('waitModel')); setTimeout(hideLoader, 600);
}

function requestVehicle(id){
  if(FILE_MODE){
    if(typeof window.__onVehiclePick==='function') window.__onVehiclePick(id);
  } else {
    loadVehicleFromFile(id);
  }
}

/* ============ RAYCAST / POSE ============ */
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let downPos=null;
renderer.domElement.addEventListener('pointerdown', e=>{ downPos={x:e.clientX,y:e.clientY}; });
renderer.domElement.addEventListener('pointerup', e=>{
  if(!downPos) return;
  const moved = Math.hypot(e.clientX-downPos.x, e.clientY-downPos.y);
  downPos=null;
  if(moved>5) return;
  if(!carGroup) return;
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX-rect.left)/rect.width)*2-1;
  mouse.y = -((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(bodyMeshes, true);
  if(!hits.length) return;
  const local = carGroup.worldToLocal(hits[0].point.clone());
  const dmg = {
    damageId: nextId(),
    x:+local.x.toFixed(4), y:+local.y.toFixed(4), z:+local.z.toFixed(4),
    memo:'', gravity:2, damageTypes:[], _world:hits[0].point.clone()
  };
  damages.push(dmg);
  addMarker(dmg);
  openPopup(damages.length-1, e.clientX, e.clientY);
});

function nextId(){ return damages.reduce((m,d)=>Math.max(m,d.damageId),0)+1; }

function addMarker(dmg){
  const grav = GRAVITIES.find(g=>g.id===dmg.gravity)||GRAVITIES[1];
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(0.06,16,16),
    new THREE.MeshBasicMaterial({color:new THREE.Color(grav.color)})
  );
  m.position.copy(dmg._world);
  m.renderOrder = 999;
  m.material.depthTest = false;
  markerGroup.add(m);
  dmg._marker = m;
}
function refreshMarker(dmg){
  const grav = GRAVITIES.find(g=>g.id===dmg.gravity)||GRAVITIES[1];
  if(dmg._marker) dmg._marker.material.color = new THREE.Color(grav.color);
}

/* ============ GESTION DU TAG [M:X] DANS LE MEMO ============ */
function stripModelTag(memo) {
  return (memo || '').replace(/\[M:\d+\]\s*/, '');
}
function addModelTag(userText) {
  var model = window.__ctxModel || 0;
  if (model > 0) {
    return '[M:' + model + '] ' + (userText || '');
  }
  return userText || '';
}

/* ============ POPUP CONTEXTUEL ============ */
function openPopup(index, screenX, screenY){
  editingIndex = index;
  const d = damages[index];
  draftTypes = d.damageTypes.map(t=>t.id);
  draftGravity = d.gravity;
  document.getElementById('popupTitle').textContent = t('titlePopup') + d.damageId;
  document.getElementById('memo').value = stripModelTag(d.memo);
  renderTypeList(); renderGravRow();
  const pop = document.getElementById('popup');
  pop.style.display='block';
  const stage = document.getElementById('stage').getBoundingClientRect();
  const pb = pop.querySelector('.pb');
  if (pb) pb.style.maxHeight = Math.max(110, stage.height - 96) + 'px';
  const pw = pop.offsetWidth || 188;
  const ph = pop.offsetHeight || 300;
  let x = (screenX!==undefined? screenX-stage.left+14 : (stage.width-pw)/2);
  let y = (screenY!==undefined? screenY-stage.top-10 : 40);
  x = Math.max(8, Math.min(x, stage.width  - pw - 8));
  y = Math.max(8, Math.min(y, stage.height - ph - 8));
  pop.style.left=x+'px'; pop.style.top=y+'px';
}
function renderTypeList(){
  const box=document.getElementById('typeList'); box.innerHTML='';
  DAMAGE_TYPES.forEach(tp=>{
    const on=draftTypes.includes(tp.id);
    const el=document.createElement('div');
    el.className='typeItem'+(on?' on':'');
    el.innerHTML='<span>'+tp.icon+'</span><span>'+tp.name+'</span><span class="chk">'+(on?'✓':'')+'</span>';
    el.onclick=()=>{
      if(on) draftTypes=draftTypes.filter(x=>x!==tp.id);
      else { if(draftTypes.length>=5){alert(t('maxTypes'));return;} draftTypes.push(tp.id); }
      renderTypeList();
    };
    box.appendChild(el);
  });
}
function renderGravRow(){
  const box=document.getElementById('gravRow'); box.innerHTML='';
  GRAVITIES.forEach(g=>{
    const on=draftGravity===g.id;
    const el=document.createElement('div');
    el.className='gravBtn'+(on?' on':'');
    if(on) el.style.background=g.color;
    el.textContent=gravName(g.id);
    el.onclick=()=>{ draftGravity=g.id; renderGravRow(); };
    box.appendChild(el);
  });
}
function confirmPopup(){
  const d=damages[editingIndex];
  if(draftTypes.length===0){ alert(t('noType')); return; }
  d.damageTypes = draftTypes.map(id=>{const tp=DAMAGE_TYPES.find(x=>x.id===id); return {id:tp.id,name:tp.name,icon:tp.icon};});
  d.gravity = draftGravity;
  var userText = document.getElementById('memo').value;
  // tag [M:X] seulement sur le premier dégât (damage_id le plus bas)
  if (d.damageId === getFirstDamageId()) {
    d.memo = addModelTag(userText);
  } else {
    d.memo = userText;
  }
  refreshMarker(d);
  closePopup(false);
  renderDmgList();
}
function getFirstDamageId() {
  var valid = damages.filter(function(d) { return d.damageTypes.length > 0; });
  if (valid.length === 0) return -1;
  return Math.min.apply(null, valid.map(function(d) { return d.damageId; }));
}
function closePopup(cancel){
  if(cancel && editingIndex!==null){
    const d=damages[editingIndex];
    if(d && d.damageTypes.length===0){ markerGroup.remove(d._marker); damages.splice(editingIndex,1); }
  }
  editingIndex=null;
  document.getElementById('popup').style.display='none';
  renderDmgList();
}

/* ============ LISTE LATÉRALE ============ */
function renderDmgList(){
  const box=document.getElementById('dmgList'); box.innerHTML='';
  document.getElementById('cnt').textContent=damages.filter(d=>d.damageTypes.length).length;
  damages.forEach((d,i)=>{
    if(d.damageTypes.length===0) return;
    const grav=GRAVITIES.find(g=>g.id===d.gravity)||GRAVITIES[1];
    const row=document.createElement('div'); row.className='dmgRow';
    row.innerHTML='<span class="gravDot" style="background:'+grav.color+'"></span>'+
      '<span class="id">#'+d.damageId+'</span>'+
      '<span>'+d.damageTypes.map(tp=>tp.icon).join('')+'</span>'+
      '<span class="co">'+d.x+','+d.y+','+d.z+'</span>';
    row.onclick=(e)=>{ if(e.target.classList.contains('del'))return; openPopup(i); };
    const del=document.createElement('span'); del.className='del'; del.textContent='✕';
    del.onclick=(e)=>{ e.stopPropagation();
      if(d.damageId>0 && window.__deleted) window.__deleted.push(d.damageId);
      markerGroup.remove(d._marker); damages.splice(i,1); renderDmgList(); };
    row.appendChild(del);
    box.appendChild(row);
  });
}
function renderThumbs(){
  const box=document.getElementById('thumbs'); box.innerHTML='';
  VEHICLES.forEach(v=>{
    const el=document.createElement('div');
    var isActive = v.id===currentVehicleId;
    var isLocked = window.__ctxModel > 0 && v.id !== currentVehicleId;
    el.className='thumb'+(isActive?' active':'')+(isLocked?' locked':'');
    el.innerHTML='<span class="ic">🚗</span>'+v.label;
    el.onclick=()=>{ if(!isLocked && v.id!==currentVehicleId) requestVehicle(v.id); };
    box.appendChild(el);
  });
}
function clearAll(silent){
  if(!silent && damages.filter(d=>d.damageTypes.length).length && !confirm(t('confirmDelete'))) return;
  if(!silent && window.__deleted){
    damages.forEach(d=>{ if(d.damageId>0) window.__deleted.push(d.damageId); });
  }
  damages=[]; while(markerGroup.children.length) markerGroup.remove(markerGroup.children[0]);
  renderDmgList();
}
function exportJSON(){
  const msg = window.copierPourWindev();
  alert('Copié dans le presse-papier :\n\n' + msg);
  return msg;
}

/* ============ MAPPING PAGE ↔ BASE DE DONNÉES ============ */
function damageToRow(d){
  const tp = d.damageTypes || [];
  return {
    damage_id: d.damageId,
    position_xvalue: d.x,
    position_yvalue: d.y,
    position_zvalue: d.z,
    damage_level: d.gravity,
    memo: d.memo || '',
    idcarstock_damage1: tp[0] ? tp[0].id : 0,
    idcarstock_damage2: tp[1] ? tp[1].id : 0,
    idcarstock_damage3: tp[2] ? tp[2].id : 0,
    idcarstock_damage4: tp[3] ? tp[3].id : 0,
    idcarstock_damage5: tp[4] ? tp[4].id : 0
  };
}
function rowToDamage(o){
  const types = [];
  for(let i=1;i<=5;i++){
    const tid = +o['idcarstock_damage'+i] || 0;
    if(tid){
      const meta = DAMAGE_TYPES.find(x=>x.id===tid);
      types.push(meta ? {id:meta.id, name:meta.name, icon:meta.icon} : {id:tid, name:'Type '+tid, icon:'🔧'});
    }
  }
  const x=+o.position_xvalue||0, y=+o.position_yvalue||0, z=+o.position_zvalue||0;
  if(carGroup) carGroup.updateMatrixWorld(true);
  return {
    damageId: +o.damage_id || nextId(),
    x:x, y:y, z:z,
    memo: o.memo || '',
    gravity: +o.damage_level || 2,
    damageTypes: types,
    _world: carGroup ? carGroup.localToWorld(new THREE.Vector3(x,y,z)) : new THREE.Vector3(x,y,z)
  };
}

let _modelReady = false;
let _pendingLoad = null;

/* ============ HOOKS WINDEV ============ */

window.loadVehicleGLB = function(base64, id, label){
  try{ parseGLB(b64ToArrayBuffer(base64), id||currentVehicleId, label||null); }
  catch(e){ showLoader(t('errBase64')); console.error(e); }
};

window.initDamageTypes = function(json){
  try{ const arr=typeof json==='string'?JSON.parse(json):json;
    DAMAGE_TYPES.length=0;
    (arr||[]).forEach(tp=>DAMAGE_TYPES.push({
      id: +tp.id,
      name: tp.name || tp.description || ('Type '+tp.id),
      icon: tp.icon || '🔧'
    }));
    damages.forEach(d=>{ d.damageTypes = d.damageTypes.map(x=>DAMAGE_TYPES.find(y=>y.id===x.id)||x); });
    renderDmgList();
  }catch(e){console.error('initDamageTypes',e);}
};

window.chargerDommages = function(json){
  if(!_modelReady){ _pendingLoad = json; console.log('[chargerDommages] modèle pas prêt, mis en attente'); return 'PENDING'; }
  try{
    let arr = json;
    if(typeof json==='string'){
      try{ arr = JSON.parse(json); }
      catch(e){ arr = JSON.parse(json.replace(/(\d),(\d)/g,'$1.$2').replace(/\s+(?=[\d\-.])/g,'')); }
    }
    clearAll(true);
    window.__deleted = [];
    (arr||[]).forEach(o => { const d = rowToDamage(o); damages.push(d); addMarker(d); });
    renderDmgList();
    console.log('[chargerDommages] '+damages.length+' dégât(s) affiché(s)');
    return 'OK:'+damages.length;
  }catch(e){ console.error('chargerDommages',e); return 'ERR:'+e.message; }
};

window.getDamagesJSON = function(){
  return JSON.stringify(damages.filter(d=>d.damageTypes.length).map(damageToRow));
};

/* ============ PONT WINDEV ↔ PAGE ============ */

window.__ctxCarstock = 0;
window.__ctxJob      = 0;
window.__ctxModel    = 0;
window.__deleted     = [];

/* setContexte avec 3 paramètres : carstock, job, vehicleModel */
window.setContexte = function (carstock, job, vehicleModel) {
  window.__ctxCarstock = parseInt(carstock, 10) || 0;
  window.__ctxJob      = parseInt(job, 10)      || 0;
  window.__ctxModel    = parseInt(vehicleModel, 10) || 0;
  console.log('[CTX] carstock=' + window.__ctxCarstock + ' job=' + window.__ctxJob + ' model=' + window.__ctxModel);

  // Si un modèle est défini → charger le bon véhicule et verrouiller
  if (window.__ctxModel > 0) {
    var vehicle = VEHICLES.find(function(v) { return v.id === window.__ctxModel; });
    if (!vehicle) {
      // chercher par index numérique (1=premier, 2=deuxième, etc.)
      if (window.__ctxModel <= VEHICLES.length) {
        vehicle = VEHICLES[window.__ctxModel - 1];
      }
    }
    if (vehicle && vehicle.id !== currentVehicleId) {
      requestVehicle(vehicle.id);
    }
    renderThumbs();
  }

  return 'CTX:' + window.__ctxCarstock + '/' + window.__ctxJob + '/M' + window.__ctxModel;
};

/* Premier choix de véhicule par l'utilisateur (quand __ctxModel === 0) */
function onFirstVehicleChoice(vehicleId) {
  // trouver l'index numérique du véhicule
  var idx = VEHICLES.findIndex(function(v) { return v.id === vehicleId; });
  if (idx >= 0) {
    window.__ctxModel = idx + 1;  // 1-based
    renderThumbs();
    console.log('[VEHICLE] premier choix verrouillé: model=' + window.__ctxModel);
  }
}

/* Override requestVehicle pour capturer le premier choix */
var _origRequestVehicle = requestVehicle;
function requestVehicle(id) {
  // Si pas encore de modèle choisi → verrouiller ce choix
  if (window.__ctxModel === 0) {
    onFirstVehicleChoice(id);
  }
  _origRequestVehicle(id);
}

/* Construit le message tamponné */
function construireMessage(action) {
  var rows = damages.filter(function (d) { return d.damageTypes.length; }).map(damageToRow);

  // S'assurer que le tag [M:X] est sur le memo du premier dégât
  if (window.__ctxModel > 0 && rows.length > 0) {
    var first = rows[0];
    if (first.memo.indexOf('[M:') === -1) {
      first.memo = '[M:' + window.__ctxModel + '] ' + first.memo;
    }
  }

  return JSON.stringify({
    action:   action || 'GET_DAMAGES_RESPONSE',
    carstock: window.__ctxCarstock,
    job:      window.__ctxJob,
    count:    rows.length,
    damages:  JSON.stringify(rows),
    deleted:  JSON.stringify(window.__deleted || [])
  });
}

function ecrirePressePapier(txt) {
  var ok = false;
  try {
    var ta = document.createElement('textarea');
    ta.value = txt;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.left = '0';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, txt.length);
    ok = document.execCommand('copy');
    document.body.removeChild(ta);
  } catch (e) { console.warn('[CLIP] execCommand KO', e); }
  if (!ok && navigator.clipboard) {
    try { navigator.clipboard.writeText(txt); ok = true; } catch (e) {}
  }
  console.log('[CLIP] écriture ' + (ok ? 'OK' : 'ÉCHEC'));
  return ok;
}

function envoyerAWinDev(msg) {
  var envoye = false;
  try { window.parent.postMessage(msg, '*'); envoye = true; } catch (e) {}
  try { if (window.parent !== window) window.postMessage(msg, '*'); } catch (e) {}
  try { if (window.WinDev && window.WinDev.postMessage) { window.WinDev.postMessage(msg); envoye = true; } } catch (e) {}
  try { if (window.Android && window.Android.postMessage) { window.Android.postMessage(msg); envoye = true; } } catch (e) {}
  return envoye;
}

window.envoyerSauvegarde = function () {
  if (!window.__ctxJob) { console.warn('[SAVE] contexte absent — WinDev va rejeter'); }
  var msg = construireMessage('GET_DAMAGES_RESPONSE');
  console.log('[SAVE] ' + msg.substring(0, 250));
  envoyerAWinDev(msg);
  ecrirePressePapier(msg);
  return msg;
};

window.copierPourWindev = function () {
  var msg = construireMessage('GET_DAMAGES_RESPONSE');
  ecrirePressePapier(msg);
  return msg;
};

window.effacerTousLesDegats = function () { clearAll(true); window.__deleted = []; return 'CLEARED'; };
window.viderCanvas          = window.effacerTousLesDegats;

/* ---- Bouton CHARGER : demande à WinDev de pousser les données ---- */
function demanderChargement() {
  console.log('[CHARGER] demande envoyée à WinDev');
  envoyerAWinDev(JSON.stringify({ action: 'DEMANDE_CHARGEMENT' }));
}

/* Diagnostics console */
window.__saveDiag = function () {
  return {
    version: window.__version,
    carstock: window.__ctxCarstock,
    job: window.__ctxJob,
    model: window.__ctxModel,
    total: damages.length,
    valides: damages.filter(function (d) { return d.damageTypes.length; }).length,
    modelReady: _modelReady
  };
};
window.__bridgeDiag = function () {
  return {
    setContexte: typeof window.setContexte,
    envoyerSauvegarde: typeof window.envoyerSauvegarde,
    copierPourWindev: typeof window.copierPourWindev,
    chargerDommages: typeof window.chargerDommages,
    initDamageTypes: typeof window.initDamageTypes,
    parentDifferent: window.parent !== window,
    execCommand: typeof document.execCommand
  };
};

/* Annonce à WinDev que la page est prête */
function annoncerPret() {
  envoyerAWinDev(JSON.stringify({ action: 'HTML_READY', version: window.__version }));
}
if (document.readyState === 'complete') { setTimeout(annoncerPret, 300); }
else { window.addEventListener('load', function () { setTimeout(annoncerPret, 300); }); }

window.__READY = true;
window.__version = "v16";

/* ============ AUTO-CLIC SUR CHARGER À L'OUVERTURE ============ */
window.addEventListener('DOMContentLoaded', function() {
  applyI18n();    // appliquer les textes traduits
  setTimeout(function() {
    document.getElementById('btnCharger').click();
  }, 500);
});

/* ============ BOUCLE ============ */
function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera); }
function resizeRenderer(){
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if(!w || !h) return;
  camera.aspect = w/h; camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
addEventListener('resize', resizeRenderer);
addEventListener('orientationchange', ()=>{ setTimeout(resizeRenderer, 200); });
if(typeof ResizeObserver !== 'undefined'){
  try{ new ResizeObserver(resizeRenderer).observe(wrap); }catch(e){}
}
renderThumbs();
applyI18n();
if(FILE_MODE){ loadPlaceholder(); }
else { loadVehicleFromFile(currentVehicleId); }
animate();
</script>
